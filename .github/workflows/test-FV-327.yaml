name: test-FV-327

on:
  repository_dispatch:
    types: [trigger_release_action]
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: "Version number to be released (e.g., 1.2.3)"
        required: true
        default: "1.0.0"
      developmentVersion:
        description: "Next version number with snapshot (e.g., 1.2.4-SNAPSHOT)"
        required: true
        default: "1.0.1-SNAPSHOT"
      use-pr:
        description: "Use PR for version bump instead of direct push"
        default: "true"

env:
  IMAGE_NAME: "dave-backend"

jobs:
  set-parameters:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      releaseVersion: ${{ steps.set-params.outputs.releaseVersion }}
      developmentVersion: ${{ steps.set-params.outputs.developmentVersion }}
      use-pr: ${{ steps.set-params.outputs.use-pr }}
    steps:
      - name: set parameters
        id: set-params
        env:
          RELEASE_VERSION: ${{ github.event.inputs.releaseVersion }}
          DEVELOPMENT_VERSION: ${{ github.event.inputs.developmentVersion }}
          USE_PR: ${{ github.event.inputs.use-pr }}
        run: |
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            echo "releaseVersion=${{ github.event.client_payload.releaseVersion }}" >> $GITHUB_OUTPUT
            echo "developmentVersion=${{ github.event.client_payload.developmentVersion }}" >> $GITHUB_OUTPUT
            echo "use-pr=true" >> $GITHUB_OUTPUT
          else
            echo "releaseVersion=${RELEASE_VERSION}" >> $GITHUB_OUTPUT
            echo "developmentVersion=${DEVELOPMENT_VERSION}" >> $GITHUB_OUTPUT
            echo "use-pr=${USE_PR}" >> $GITHUB_OUTPUT
          fi
          cat $GITHUB_OUTPUT
  job1:
    runs-on: ubuntu-latest
    needs: set-parameters
    permissions: {}
    steps:
      - name: Job1 Empfangene Parameter anzeigen
        run: |
          echo "releaseVersion: ${{ needs.set-parameters.outputs.releaseVersion }}"
          echo "developmentVersion: ${{ needs.set-parameters.outputs.developmentVersion }}"
          echo "use-pr: ${{ needs.set-parameters.outputs.use-pr }}"

      # Füge hier weitere Schritte hinzu, die die Parameter verwenden
      - name: Job1 Beispiel Schritt
        run: |
          # Hier kannst du mit den Parametern arbeiten
          echo "Verwende releaseVersion: ${{ needs.set-parameters.outputs.releaseVersion }}"
          echo "Verwende developmentVersion: ${{ needs.set-parameters.outputs.developmentVersion }}"
          echo "use-pr: ${{ needs.set-parameters.outputs.use-pr }}"
