spring:
  application.name: @project.artifactId@
  banner.location: banner.txt
  jpa.properties:
    hibernate.search.default.directory_provider: filesystem
    hibernate.search.default.indexBase: ./index/default

  # Wird bei der PDF-Generierung benötigt, damit das Backend auch Diagramme > 1MB verarbeiten kann
  servlet.multipart.max-file-size: 10MB
  servlet.multipart.max-request-size: 10MB

server:
  shutdown: "graceful"
  port: 8080
  error:
    include-exception: false
    include-stacktrace: never
    whitelabel:
      enabled: false

# OpenAPi configuration
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    csrf:
      enabled: 'true'

# Config for spring actuator endpoints
management:
  server.port: ${server.port}
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health, info, prometheus, livenessstate, readinessstate
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      access: read_only
      probes:
        enabled: true
    info:
      access: read_only
    prometheus:
      access: read_only
  info:
    env:
      enabled: true
info.application.name: @project.artifactId@
info.application.version: @project.version@


dave:
  radius:
    distance-check-meter: 25
  zaehlung:
    status-updater:
      # Jeden Tag um 04:00 Uhr
      cron: 0 0 4 1/1 * ?
      # Sollte immer knapp unter dem Cron sein
      shedlock: 1380m
  email:
    sender:
      # Server Einstellungen
      hostname: <SMTP-Mailserver-URL>
      # URLs für den Link in der EMail
      url:
        adminportal: https://dave-adminportal
        selfserviceportal: https://dave-selfserviceportal
    receiver:
      # Server Einstellungen
      hostname: <IMAP-Server-URL>
      protocol: imap
      port: 993
      # Default Update-Intervall in Millisekunden für den Email-Abruf
      #      Alle 60 min
      cron: 0 0 0/1 1/1 * ?
      # Sollte immer knapp unter dem Cron sein
      shedlock: 59m
      folder-success: Erfolgreich
      folder-error: Fehlerhaft
      cut-email-body:
        # Antwortemails ab hier bereinigen. Semikolon ist ein ODER
        line-contains-strings: "Parameter1;Parameter2;-----Ursprüngliche Nachricht-----"
        line-begins-with-strings: "Von:;Gesendet:"
  messstelle:
    # Jeden Tag um 01:00 Uhr
    cron: 0 0 1 1/1 * ?
    # Sollte immer knapp unter dem Cron sein
    shedlock: 1380m
  unauffaellige-tage:
    # Jeden Tag um 02:00 Uhr
    cron: 0 0 2 1/1 * ?
    # Sollte immer knapp unter dem Cron sein
    shedlock: 1380m
  onnx:
    modelle:
      - id: rad-2x4h-v1
        version: "1"
        ziel: RAD
        zaehldauer: DAUER_2_X_4_STUNDEN
        resource-path: model/Rad_Modell_DAVE_2x4h.onnx
        input-tensor-name: int64_input
        input-schema: REINE_RADWERTE_V1
      - id: rad-13h-v1
        version: "1"
        ziel: RAD
        zaehldauer: DAUER_13_STUNDEN
        resource-path: model/Rad_Modell_DAVE_13h.onnx
        input-tensor-name: int64_input
        input-schema: REINE_RADWERTE_V1
      - id: rad-16h-v1
        version: "1"
        ziel: RAD
        zaehldauer: DAUER_16_STUNDEN
        resource-path: model/Rad_Modell_DAVE_16h.onnx
        input-tensor-name: int64_input
        input-schema: REINE_RADWERTE_V1
  zaehlstelle:
    automatic-number-assignment: true
    link-documentation-csv-file-for-upload-zaehlung: https://github.com/it-at-m/dave/blob/main/docs/src/de/documentation-csv-for-upload.md

  stadtbezirk-mapping-config-url: ${STADTBEZIRK_MAPPING_CONFIG_URL:classpath:/config/stadtbezirke.properties}

  tenant:
    datenportal-header: Datenportal
    map:
      center:
        lat: "48.137227"
        lng: "11.575517"
        zoom: 12
